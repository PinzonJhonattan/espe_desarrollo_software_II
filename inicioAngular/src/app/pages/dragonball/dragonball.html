<h1 class="text-center m-4">Dragonball</h1>

<hr>

<section class="row">

    <div class="col-12 col-sm-6">
        <h3>Agregar: {{ name() }} - {{ power() }}</h3>
        <input 
        type="text" 
        class="form-control mt-2" 
        placeholder="Nombre"
        [value]="name()"
        (input)="name.set(txtName.value)"
        #txtName
        >
        <input 
        type="number" 
        class="form-control mt-2" 
        placeholder="Poder"
        [value]="power()"
        (input)="power.set(+txtPower.value || 0)"
        #txtPower
        >
        <button class="mt-2 btn btn-primary" (click)="addCharacter()">Agregar</button>
    </div>

    <div class="col-12 col-sm-6">
        <h3>Lista</h3>

        <ul class="list-group">
            @for (character of characters(); track character.id; let idx = $index) {
                @if(character.power > 5000){        
                <li>
                    <span> {{ idx + 1 }} - {{ character.name }}: </span>
                    <!--<span 
                    [class.text-danger]="character.power > 9000"
                    [class.text-success]="character.power < 9000"
                    >{{ character.power }}</span>-->
                    <span 
                    [class]="poweClass()"
                    >{{ character.power }}</span>
                </li>
              }@else{
                <li>
                    <span class="text-success">personajes con poder bajo</span>
                </li>
              }
            }
        </ul>
    </div>

</section>
