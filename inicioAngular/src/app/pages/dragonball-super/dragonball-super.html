<h1 class="text-center m-4">Dragonball</h1>

<hr>

<section class="row">

    <div class="col-12 col-sm-6">
        <h3>Agregar: {{ name() }} - {{ power() }}</h3>
        <input 
        type="text" 
        class="form-control mt-2" 
        placeholder="Nombre"
        [value]="name()"
        (input)="name.set(txtName.value)"
        #txtName
        >
        <input 
        type="number" 
        class="form-control mt-2" 
        placeholder="Poder"
        [value]="power()"
        (input)="power.set(+txtPower.value || 0)"
        #txtPower
        >
        <button class="mt-2 btn btn-primary" (click)="addCharacter()">Agregar</button>
    </div>

    <div class="col-12 col-sm-6">
        <dragonball-character-list 
        [characters]="characters()"
        listName="Lista de Dragon Ball Super">
        </dragonball-character-list> 
    </div>

</section>
